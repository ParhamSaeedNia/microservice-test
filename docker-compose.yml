name: market

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
      POSTGRES_DB: ${POSTGRES_DB:-market}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market} -d ${POSTGRES_DB:-market}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - market

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 25s
    networks:
      - market

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    networks:
      - market

  kafka-connect:
    image: quay.io/debezium/connect:3.0.8.Final
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: market-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - market

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: market
      RABBITMQ_DEFAULT_PASS: market
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks:
      - market

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - market

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/logs
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - market

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
    networks:
      - market

  kibana-init:
    image: curlimages/curl:8.11.1
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/kibana/saved-objects.ndjson:/saved.ndjson:ro
      - ./docker/kibana/import.sh:/import.sh:ro
    entrypoint: ["/bin/sh", "/import.sh"]
    networks:
      - market

  prometheus:
    image: prom/prometheus:v2.55.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - market

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - market

  catalog:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/apps/Dockerfile
      args:
        APP: catalog
    environment:
      CATALOG_PORT: "3001"
      CATALOG_DATABASE_URL: postgres://market:market@postgres:5432/catalog
      LOG_DIR: /logs
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - market

  orders:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/apps/Dockerfile
      args:
        APP: orders
    environment:
      ORDERS_PORT: "3002"
      ORDERS_DATABASE_URL: postgres://market:market@postgres:5432/orders
      CATALOG_BASE_URL: http://catalog:3001
      KAFKA_BROKERS: kafka:19092
      LOG_DIR: /logs
    ports:
      - "3002:3002"
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    networks:
      - market

  inventory:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/apps/Dockerfile
      args:
        APP: inventory
    environment:
      INVENTORY_PORT: "3003"
      INVENTORY_DATABASE_URL: postgres://market:market@postgres:5432/inventory
      KAFKA_BROKERS: kafka:19092
      LOG_DIR: /logs
    ports:
      - "3003:3003"
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - market

  notifications:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/apps/Dockerfile
      args:
        APP: notifications
    environment:
      NOTIFICATIONS_PORT: "3004"
      NOTIFICATIONS_DATABASE_URL: postgres://market:market@postgres:5432/notifications
      RABBITMQ_URL: amqp://market:market@rabbitmq:5672
      LOG_DIR: /logs
    ports:
      - "3004:3004"
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - market

  dispatcher:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/apps/Dockerfile
      args:
        APP: dispatcher
    environment:
      DISPATCHER_PORT: "3005"
      KAFKA_BROKERS: kafka:19092
      RABBITMQ_URL: amqp://market:market@rabbitmq:5672
      LOG_DIR: /logs
    ports:
      - "3005:3005"
    volumes:
      - ./logs:/logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - market

volumes:
  pgdata:

networks:
  market:
    name: market
